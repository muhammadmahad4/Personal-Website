<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="butlerBg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#170b05"/>
      <stop offset="100%" stop-color="#2a1608"/>
    </linearGradient>
    <linearGradient id="badgeFillButler" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glowButler" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#butlerBg)"/>

  <g stroke="#5c3a1e" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Terminal window -->
  <rect x="40" y="52" width="720" height="300" rx="10" fill="#1c0f06" stroke="#92400e" stroke-width="1.2"/>
  <rect x="40" y="52" width="720" height="30" rx="10" fill="#2b1a0c"/>
  <rect x="40" y="67" width="720" height="15" fill="#2b1a0c"/>
  <circle cx="63" cy="67" r="5.5" fill="#ff5f57"/>
  <circle cx="81" cy="67" r="5.5" fill="#febc2e"/>
  <circle cx="99" cy="67" r="5.5" fill="#28c840"/>
  <text x="400" y="72" text-anchor="middle" fill="#a8794f" font-family="monospace" font-size="11">butler@BUTLER: C:\Program Files\Jenkins</text>

  <text x="58" y="110" fill="#c99b6b" font-family="monospace" font-size="12">$ curl -I http://10.0.2.15:8080/</text>
  <text x="58" y="130" fill="#e0b787" font-family="monospace" font-size="11">X-Jenkins: 2.289.3</text>

  <text x="58" y="160" fill="#c99b6b" font-family="monospace" font-size="12">Script Console &gt;</text>
  <text x="58" y="182" fill="#fbbf24" font-family="monospace" font-size="11.5">"whoami".execute().text</text>
  <text x="58" y="204" fill="#34d399" font-family="monospace" font-size="11.5">-&gt; butler\butler</text>

  <text x="58" y="234" fill="#c99b6b" font-family="monospace" font-size="12">PS C:\Program Files\Jenkins&gt; whoami /groups</text>
  <text x="58" y="256" fill="#e0b787" font-family="monospace" font-size="11">BUILTIN\Administrators   Enabled group</text>

  <text x="58" y="286" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glowButler)">dir Administrator\Desktop -&gt; access granted</text>
  <rect x="58" y="294" width="8" height="13" fill="#fbbf24" opacity="0.85"/>

  <!-- Badges row -->
  <rect x="40" y="378" width="150" height="34" rx="17" fill="url(#badgeFillButler)" opacity="0.9"/>
  <text x="115" y="400" text-anchor="middle" fill="#fff7ed" font-family="Inter,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">PEH &#183; BUTLER</text>

  <rect x="202" y="378" width="150" height="34" rx="17" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1"/>
  <text x="277" y="400" text-anchor="middle" fill="#fbbf24" font-family="Inter,sans-serif" font-size="12" font-weight="600">CVE-2024-23897</text>

  <rect x="364" y="378" width="110" height="34" rx="17" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1"/>
  <text x="419" y="400" text-anchor="middle" fill="#fbbf24" font-family="Inter,sans-serif" font-size="12" font-weight="600">Jenkins</text>

  <rect x="486" y="378" width="150" height="34" rx="17" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1"/>
  <text x="561" y="400" text-anchor="middle" fill="#fbbf24" font-family="Inter,sans-serif" font-size="12" font-weight="600">Default Creds</text>

  <text x="760" y="400" text-anchor="end" fill="#5c3a1e" font-family="monospace" font-size="10.5">box 4 of 5</text>
</svg>
