<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.07)"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle diagonal lines for texture -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="-100" y1="0" x2="350" y2="450"/><line x1="0" y1="0" x2="450" y2="450"/>
    <line x1="100" y1="0" x2="550" y2="450"/><line x1="200" y1="0" x2="650" y2="450"/>
    <line x1="300" y1="0" x2="750" y2="450"/><line x1="400" y1="0" x2="850" y2="450"/>
    <line x1="500" y1="0" x2="950" y2="450"/><line x1="600" y1="0" x2="1050" y2="450"/>
  </g>

  <!-- Title + subtitle at top -->
  <text x="400" y="42" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="19" font-weight="700">Auto-Emailing Website</text>
  <text x="400" y="63" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="Inter,sans-serif" font-size="12">AI-powered email automation · DeepSeek API · Google OAuth</text>

  <!-- STEP 1: Extract Contacts (x=42) -->
  <rect x="42" y="88" width="185" height="210" rx="14" fill="url(#card1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="42" cy="88" r="16" fill="white"/>
  <text x="42" y="93" text-anchor="middle" fill="#1d4ed8" font-family="Inter,sans-serif" font-size="14" font-weight="800">1</text>
  <!-- Icon circle -->
  <circle cx="134" cy="150" r="36" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Link/URL icon -->
  <rect x="119" y="141" width="20" height="13" rx="6.5" fill="none" stroke="white" stroke-width="2.2"/>
  <rect x="129" y="141" width="20" height="13" rx="6.5" fill="none" stroke="white" stroke-width="2.2"/>
  <circle cx="124" cy="163" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="134" cy="163" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="144" cy="163" r="2" fill="rgba(255,255,255,0.6)"/>
  <text x="134" y="208" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="14" font-weight="700">Extract</text>
  <text x="134" y="226" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Inter,sans-serif" font-size="12">Contacts</text>
  <text x="134" y="247" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">700+ URLs · MongoDB</text>
  <text x="134" y="263" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">OpenAI API · Python</text>

  <!-- Arrow 1 to 2 -->
  <g opacity="0.75">
    <line x1="232" y1="193" x2="295" y2="193" stroke="white" stroke-width="2"/>
    <polyline points="289,187 297,193 289,199" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 2: AI Generate (center, highlighted) -->
  <rect x="307" y="78" width="185" height="230" rx="14" fill="url(#card2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="307" cy="78" r="16" fill="white"/>
  <text x="307" y="83" text-anchor="middle" fill="#1d4ed8" font-family="Inter,sans-serif" font-size="14" font-weight="800">2</text>
  <circle cx="399" cy="148" r="36" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Star sparkle (AI icon) -->
  <polygon points="399,128 402,141 415,141 405,149 409,162 399,155 389,162 393,149 383,141 396,141"
           fill="white" opacity="0.95" filter="url(#iconGlow)"/>
  <text x="399" y="208" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="14" font-weight="700">AI Generate</text>
  <text x="399" y="226" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Inter,sans-serif" font-size="12">Email Content</text>
  <text x="399" y="247" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">DeepSeek API</text>
  <text x="399" y="263" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">Prompt Engineering</text>
  <rect x="348" y="278" width="102" height="20" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="399" y="292" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="10" font-weight="700">AI-Powered</text>

  <!-- Arrow 2 to 3 -->
  <g opacity="0.75">
    <line x1="497" y1="193" x2="560" y2="193" stroke="white" stroke-width="2"/>
    <polyline points="554,187 562,193 554,199" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 3: Send Email -->
  <rect x="572" y="88" width="185" height="210" rx="14" fill="url(#card1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="url(#cardShadow)"/>
  <circle cx="572" cy="88" r="16" fill="white"/>
  <text x="572" y="93" text-anchor="middle" fill="#1d4ed8" font-family="Inter,sans-serif" font-size="14" font-weight="800">3</text>
  <circle cx="664" cy="150" r="36" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Envelope icon -->
  <rect x="645" y="138" width="38" height="27" rx="3" fill="none" stroke="white" stroke-width="2.2"/>
  <polyline points="645,138 664,154 683,138" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="676" y1="158" x2="686" y2="148" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round"/>
  <polyline points="682,148 686,148 686,152" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="664" y="208" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="14" font-weight="700">Send Email</text>
  <text x="664" y="226" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Inter,sans-serif" font-size="12">Automated</text>
  <text x="664" y="247" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">Google OAuth 2.0</text>
  <text x="664" y="263" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,sans-serif" font-size="10.5">React · Node.js</text>

  <!-- Stats strip -->
  <rect x="0" y="328" width="800" height="68" fill="rgba(0,0,0,0.18)"/>
  <line x1="0" y1="328" x2="800" y2="328" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <text x="150" y="358" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="26" font-weight="800">90%</text>
  <text x="150" y="378" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="Inter,sans-serif" font-size="11">faster workflows</text>

  <line x1="280" y1="338" x2="280" y2="386" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <text x="400" y="356" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="14" font-weight="700">Google OAuth 2.0</text>
  <text x="400" y="376" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="Inter,sans-serif" font-size="11">secure authentication</text>

  <line x1="520" y1="338" x2="520" y2="386" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <text x="660" y="356" text-anchor="middle" fill="white" font-family="Inter,sans-serif" font-size="14" font-weight="700">DeepSeek API</text>
  <text x="660" y="376" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="Inter,sans-serif" font-size="11">AI content generation</text>

  <!-- Footer -->
  <rect x="0" y="396" width="800" height="54" fill="rgba(0,0,0,0.3)"/>
  <line x1="0" y1="396" x2="800" y2="396" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="20" y="420" fill="rgba(255,255,255,0.4)" font-family="Inter,sans-serif" font-size="10.5">PERSONAL PROJECT</text>
  <text x="20" y="438" fill="rgba(255,255,255,0.55)" font-family="Inter,sans-serif" font-size="10.5">Full-Stack · React · Node.js · Express · DeepSeek API · Google OAuth</text>
  <text x="780" y="429" text-anchor="end" fill="rgba(255,255,255,0.6)" font-family="Inter,sans-serif" font-size="11" font-weight="600">github.com/muhammadmahad4</text>
</svg>
